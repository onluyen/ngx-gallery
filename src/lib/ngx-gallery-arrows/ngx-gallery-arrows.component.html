<div class="ngx-gallery-arrow-wrapper ngx-gallery-arrow-left">
  <a class="ngx-gallery-arrow ngx-gallery-icon" (click)="handlePrevClick()" [class.ngx-gallery-disabled]="prevDisabled" aria-hidden="true">
    <i class="ngx-gallery-icon-content {{ arrowPrevIcon }}"></i>
  </a>
  </div>
<div class="ngx-gallery-arrow-wrapper ngx-gallery-arrow-right">
  <a class="ngx-gallery-arrow ngx-gallery-icon" (click)="handleNextClick()" [class.ngx-gallery-disabled]="nextDisabled" aria-hidden="true">
    <i class="ngx-gallery-icon-content {{ arrowNextIcon }}"></i>
  </a>
</div>
